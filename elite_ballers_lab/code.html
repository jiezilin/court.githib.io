<script>
        // Interactive Selection Logic
        document.querySelectorAll('.grid button:not([disabled])').forEach(btn => {
            btn.addEventListener('click', function() {
                if(this.classList.contains('opacity-30')) return;
                
                document.querySelectorAll('.grid button:not([disabled])').forEach(b => {
                    if(!b.classList.contains('opacity-30')) {
                        b.classList.remove('border-2', 'border-primary', 'bg-primary/10', 'text-primary');
                        b.classList.add('border', 'border-outline-variant', 'text-on-surface', 'bg-surface-container-low');
                    }
                });
                this.classList.remove('border', 'border-outline-variant', 'text-on-surface', 'bg-surface-container-low');
                this.classList.add('border-2', 'border-primary', 'bg-primary/10', 'text-primary');
            });
        });

        document.querySelectorAll('.flex.overflow-x-auto > div').forEach(date => {
            date.addEventListener('click', function() {
                document.querySelectorAll('.flex.overflow-x-auto > div').forEach(d => {
                    d.classList.remove('bg-[#ff8c00]', 'text-black', 'shadow-lg', 'shadow-[#ff8c00]/20');
                    d.querySelector('span:first-child').classList.add('opacity-80');
                    d.classList.add('bg-surface-container-low', 'border', 'border-outline-variant', 'text-on-surface-variant');
                });
                this.classList.remove('bg-surface-container-low', 'border', 'border-outline-variant', 'text-on-surface-variant');
                this.classList.add('bg-[#ff8c00]', 'text-black', 'shadow-lg', 'shadow-[#ff8c00]/20');
                this.querySelector('span:first-child').classList.remove('opacity-80');
            });
        });
    </script>
