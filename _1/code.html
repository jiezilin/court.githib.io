  <span class="material-symbols-outlined">person</span>
  <span class="font-label-sm text-[10px] mt-1 uppercase">個人檔案</span>
</button></nav>
<script>
        // Simple micro-interactions for the form buttons
        document.querySelectorAll('form button[type="button"]').forEach(btn => {
            btn.addEventListener('click', function(e) {
                // Toggle active styles if they are part of a grid selection
                const parent = this.parentElement;
                if (parent.classList.contains('grid')) {
                    parent.querySelectorAll('button').forEach(b => {
                        b.classList.remove('border-primary-container', 'text-primary-container');
                        b.classList.add('border-outline-variant', 'text-on-surface', 'opacity-60');
                    });
                    this.classList.add('border-primary-container', 'text-primary-container');
                    this.classList.remove('border-outline-variant', 'text-on-surface', 'opacity-60');
                }
            });
        });

        // Form submission prevents default for this mockup
        document.querySelector('form').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Court registration sequence initiated.');
        });
    </script>
