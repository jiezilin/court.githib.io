<script>
        // Time Slot selection logic
        document.querySelectorAll('section:nth-of-type(4) button').forEach(btn => {
            btn.addEventListener('click', function() {
                if(this.classList.contains('opacity-40')) return;
                document.querySelectorAll('section:nth-of-type(4) button').forEach(b => {
                    b.classList.remove('border-2', 'border-primary-container', 'bg-primary-container/20', 'text-primary-container', 'active-glow', 'font-bold');
                    b.classList.add('border', 'border-outline-variant', 'bg-surface-container');
                });
                this.classList.remove('border', 'border-outline-variant', 'bg-surface-container');
                this.classList.add('border-2', 'border-primary-container', 'bg-primary-container/20', 'text-primary-container', 'active-glow', 'font-bold');
            });
        });

        // Date Picker logic
        const dateItems = document.querySelectorAll('.overflow-x-auto > div');
        dateItems.forEach(item => {
            item.addEventListener('click', function() {
                dateItems.forEach(i => {
                    i.classList.remove('bg-primary-container', 'text-on-primary-fixed', 'border-2', 'border-primary-container', 'active-glow');
                    i.classList.add('bg-surface-container', 'border', 'border-outline-variant');
                });
                this.classList.remove('bg-surface-container', 'border', 'border-outline-variant');
                this.classList.add('bg-primary-container', 'text-on-primary-fixed', 'border-2', 'border-primary-container', 'active-glow');
            });
        });
    </script>
