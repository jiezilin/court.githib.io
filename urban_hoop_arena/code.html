<script>
        // Micro-interaction for selecting time slots
        const timeSlots = document.querySelectorAll('.grid button:not(.opacity-40)');
        timeSlots.forEach(slot => {
            slot.addEventListener('click', () => {
                timeSlots.forEach(s => {
                    s.classList.remove('bg-primary-container', 'text-on-primary-fixed', 'font-bold', 'border-primary-container');
                    s.classList.add('bg-surface-container-high', 'text-on-surface', 'border-outline-variant');
                });
                slot.classList.remove('bg-surface-container-high', 'text-on-surface', 'border-outline-variant');
                slot.classList.add('bg-primary-container', 'text-on-primary-fixed', 'font-bold', 'border-primary-container');
            });
        });

        // Date picker selection
        const dateButtons = document.querySelectorAll('.hide-scrollbar button');
        dateButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                dateButtons.forEach(b => {
                    b.classList.remove('bg-primary-container', 'text-on-primary-fixed');
                    b.classList.add('bg-surface-container-high', 'text-on-surface', 'border', 'border-outline-variant');
                });
                btn.classList.add('bg-primary-container', 'text-on-primary-fixed');
                btn.classList.remove('bg-surface-container-high', 'text-on-surface', 'border-outline-variant');
            });
        });
    </script>
