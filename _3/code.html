<script>
        // Simple search interaction
        const searchInput = document.querySelector('input[type="text"]');
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('main section.grid > div');
            
            cards.forEach(card => {
                const title = card.querySelector('h3').textContent.toLowerCase();
                if (title.includes(query)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        });

        // Toggle effect for filter tags
        const filters = document.querySelectorAll('input[type="checkbox"]');
        filters.forEach(filter => {
            filter.addEventListener('change', function() {
                // In a real app, this would trigger a re-filtering logic
                console.log('Filter toggled:', this.nextElementSibling.querySelector('span:last-child').textContent);
            });
        });
    </script>
