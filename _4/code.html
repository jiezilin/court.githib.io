<!-- Custom Cursor Effect -->
<div class="fixed w-[600px] h-[600px] rounded-full pointer-events-none z-[1] transition-opacity duration-1000 opacity-0 bg-[radial-gradient(circle,rgba(255,140,0,0.05)_0%,transparent_70%)]" id="cursor-glow"></div>
<script>
        // Interactive glow following mouse
        const glow = document.getElementById('cursor-glow');
        window.addEventListener('mousemove', (e) => {
            glow.style.opacity = '1';
            const x = e.clientX - 300;
            const y = e.clientY - 300;
            glow.style.transform = `translate3d(${x}px, ${y}px, 0)`;
        });

        // Micro-interactions for buttons
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('mousedown', () => {
                button.classList.add('scale-95');
            });
            button.addEventListener('mouseup', () => {
                button.classList.remove('scale-95');
            });
            button.addEventListener('mouseleave', () => {
                button.classList.remove('scale-95');
            });
        });

        // Simple enter animation
        document.addEventListener('DOMContentLoaded', () => {
            const main = document.querySelector('main');
            main.style.opacity = '0';
            main.style.transition = 'opacity 1s ease-out';
            setTimeout(() => {
                main.style.opacity = '1';
            }, 100);
        });
    </script>
